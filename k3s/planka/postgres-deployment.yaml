apiVersion: apps/v1
kind: Deployment
metadata:
  name: planka-postgres
  namespace: planka
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: planka-postgres
  template:
    metadata:
      labels:
        app: planka-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: planka
            - name: POSTGRES_USER
              value: planka
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: planka-postgres
                  key: POSTGRES_PASSWORD
            # Longhorn volumes come up with lost+found in the root, and initdb
            # refuses a non-empty directory. Point it one level down.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "planka", "-d", "planka"]
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "planka", "-d", "planka"]
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
            timeoutSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: planka-postgres-data
