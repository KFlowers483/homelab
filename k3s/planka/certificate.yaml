apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: planka-tls
  namespace: planka
spec:
  secretName: planka-tls
  duration: 2160h        # 90 days
  renewBefore: 360h      # renew at 15 days remaining
  commonName: planka.home
  dnsNames:
    - planka.home
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: homelab-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
